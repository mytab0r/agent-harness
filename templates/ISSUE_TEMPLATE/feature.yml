name: Feature
description: A problem worth solving, with acceptance criteria and an explicit out-of-scope.
title: "[feature] "
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what happens today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: A direction, not a full design. Note alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable results. Each criterion names how it will be checked.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this will deliberately not solve?
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and unknowns
      description: What could make this fail or become unnecessary?
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
      default: 2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - app
        - infra
        - docs
        - design
    validations:
      required: true
