name: board-sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync epics, sub-issues and fields
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the board token
        env:
          GH_TOKEN: ${{ secrets.BOARD_SYNC_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::BOARD_SYNC_TOKEN is not configured; see docs/board.md."
            exit 1
          fi
      - name: Sync and verify
        env:
          GH_TOKEN: ${{ secrets.BOARD_SYNC_TOKEN }}
        run: node scripts/sync-board.mjs --apply --verify
